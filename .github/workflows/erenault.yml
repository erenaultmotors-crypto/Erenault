name: Erenault (sayfa + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: erenault
  cancel-in-progress: false

jobs:
  sayfa:
    name: Uygulama ekranlarını yayınla (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Android uygulamasını (APK) derle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor projesi
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$URL"
          echo "Uygulama adresi: $URL"
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx capacitor-assets generate --android --iconBackgroundColor '#181c1f' --splashBackgroundColor '#181c1f'
          M=android/app/src/main/AndroidManifest.xml
          for P in RECORD_AUDIO MODIFY_AUDIO_SETTINGS CAMERA ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS; do
            grep -q "permission.$P\"" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          python3 ../scripts/android_extra.py
          sed -i 's#versionCode 1#versionCode ${{ github.run_number }}#; s#versionName "1.0"#versionName "1.${{ github.run_number }}"#' android/app/build.gradle
          npx cap sync android
      - name: Derle
        working-directory: app/android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
      - name: İmzala
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KS" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            echo "$KS" | base64 -d > ks.jks
            IN=$(ls app/android/app/build/outputs/apk/release/*.apk | head -1)
            $BT/zipalign -p -f 4 "$IN" aligned.apk
            $BT/apksigner sign --ks ks.jks --ks-key-alias erenault --ks-pass env:KSP --key-pass env:KSP --out out/Erenault.apk aligned.apk
            rm -f ks.jks
          else
            echo "::warning::İmza anahtarı eklenmemiş; deneme (debug) APK'sı üretildi."
            cp $(ls app/android/app/build/outputs/apk/debug/*.apk | head -1) out/Erenault-deneme.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Erenault-APK
          path: out/*.apk
      - name: İndirme sayfasına koy (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Erenault ${{ github.run_number }}
          body: Telefona indirip kurun. Önceki sürümün üstüne kurulur, kayıtlar silinmez.
          files: out/*.apk
          make_latest: true
