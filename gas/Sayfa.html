<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark brand header carrying the logo, light warm working area below; customer views get a sticky price bar, panel gets big tab buttons. Single light look by choice (easy to read in the workshop). */
:root{
  --bg:#f2f1ee; --panel:#ffffff; --panel-2:#f7f6f3; --line:#dedbd4; --line-strong:#b9b5ac; --fg:#1d1e22; --muted:#62646a;
  --accent:#f2a531; --accent-text:#a86400; --accent-ink:#1b1305; --accent-soft:rgba(242,165,49,.16);
  --good:#1e8a4f; --info:#2a68ad; --warn:#b7791f; --bad:#c43f38;
  --head:#1b1c20; --head-fg:#eceae5; --head-muted:#a9abb1;
  --paper:#fffdf8; --ink:#17181c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:28px} h3{font-size:21px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{background:var(--head);color:var(--head-fg);border-bottom:3px solid var(--accent)}
header.top .muted{color:var(--head-muted)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.logo{height:62px;width:auto;-webkit-mask-image:radial-gradient(ellipse 70% 75% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 70% 75% at 50% 50%,#000 60%,transparent 100%)}
nav.views{display:flex;gap:6px}
nav.views a{display:flex;flex-direction:column;padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--head-muted);border:1px solid transparent;line-height:1.15}
nav.views a small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
nav.views a b{font-family:var(--display);font-size:17px;font-weight:600;color:var(--head-fg)}
nav.views a[aria-current="page"]{border-color:var(--accent-text);background:rgba(242,165,49,.18)}
nav.views a[aria-current="page"] b{color:var(--accent)}
.draftbar{font-size:12.5px;color:var(--muted);padding-block:6px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.draftbar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.acc{border-color:var(--accent-text);color:var(--accent-text)}

main{padding-block:22px 120px}
.section{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.step{display:flex;align-items:baseline;gap:10px}
.step .n{font-family:var(--display);font-size:15px;font-weight:700;color:var(--accent-ink);background:var(--accent);width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none}
.muted{color:var(--muted)}
.small{font-size:14px}

/* engine cards */
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--line-strong)}
.opt[aria-pressed="true"]{border-color:var(--accent-text);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%)}
.opt .t{font-family:var(--display);font-size:20px;font-weight:600}
.opt .code{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt .p{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent-text)}
.opt .d{font-size:13px;color:var(--muted)}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.tiers{grid-template-columns:1fr}}
.tierbar{display:flex;gap:3px;margin-top:2px}
.tierbar i{height:5px;flex:1;border-radius:2px;background:var(--line)}
.tierbar i.on{background:var(--accent)}

/* parts list */
.parts{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .name{font-weight:600;min-width:0}
.prow .name small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.prow .price{font-family:var(--display);font-size:18px;font-weight:600;text-align:right;min-width:92px}
.prow.off .price{color:var(--muted);text-decoration:line-through}
.prow.labor{background:var(--panel-2)}
@media (max-width:620px){.prow{grid-template-columns:1fr auto}.prow .sel{grid-column:1/-1;grid-row:2}}
select,input[type=text],input[type=tel],input[type=number],input[type=date],textarea{width:100%;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:10px 11px;min-width:0;font-size:16px}
select:hover,input:hover,textarea:hover{border-color:var(--muted)}
.custom{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);margin-left:6px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent-text);flex:none}

.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
label.f span{font-weight:600;letter-spacing:.02em}

/* sticky total */
.totalbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.totalbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.totalbar .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.totalbar .amt{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.totalbar .pkg{font-size:13px;color:var(--muted)}
.totalbar .btn{margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.pri{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.wa{background:#1f9d57;border-color:#1f9d57;color:#fff}
.btn.sm{padding:8px 12px;font-size:14.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}

.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--body);font-size:13.5px;max-height:280px;overflow:auto;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panel */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--display);font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent-text)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pipe button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.pipe button[aria-pressed="true"]{border-color:var(--fg)}
.pipe .c{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.pipe .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st-gonderildi{--s:var(--muted)} .st-geldi{--s:var(--info)} .st-satildi{--s:var(--accent-text)} .st-teslim{--s:var(--good)}
.dot{background:var(--s)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--s);color:var(--s);white-space:nowrap}
.sale{border:1px solid var(--line);border-left:3px solid var(--s);border-radius:10px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.sale .hd{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sale .who{min-width:0;flex:1}
.sale .who b{font-size:16px}
.sale .amt{font-family:var(--display);font-size:22px;font-weight:700;text-align:right}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.track div{font-size:11.5px;color:var(--muted);border-top:3px solid var(--line);padding-top:4px}
.track div.on{border-top-color:var(--s);color:var(--fg)}
.track div b{display:block;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.track{grid-template-columns:repeat(2,1fr)}}
.ex{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{border-color:var(--accent-text)} .kpi.hl .v{color:var(--accent-text)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;color:inherit}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--panel)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--panel)}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:170px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px;position:relative}
.bars .b i{display:block;border-radius:3px 3px 0 0}
.bars .b i.c{background:#cfcbc2}
.bars .b i.k{background:var(--accent)}
.bars .b span{position:absolute;top:-2px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.blbl{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font-size:12px;color:var(--muted);text-align:center;padding-top:5px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

details.pe{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.pe summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;list-style:none}
details.pe summary::-webkit-details-marker{display:none}
details.pe summary::before{content:"›";font-size:20px;color:var(--muted);transition:transform .15s}
details.pe[open] summary::before{transform:rotate(90deg)}
details.pe .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.orow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.orow.h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:620px){.orow{grid-template-columns:1fr 1fr}.orow.h{display:none}.orow .del{justify-self:end}}
.iconbtn{background:none;border:1px solid var(--line);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}

/* bottom tab bar (app only) */
body.has-tabs{--navh:calc(66px + env(safe-area-inset-bottom,0px))}
body.has-tabs main{padding-bottom:calc(var(--navh) + 110px)}
body.has-tabs .totalbar{bottom:var(--navh)}
body.has-tabs .toast{bottom:calc(var(--navh) + 96px)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);margin:0;background:var(--head);border-top:3px solid var(--accent);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px}
nav.tabbar a{flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;border-radius:10px;text-align:center;border:0!important;min-height:54px}
nav.tabbar a svg{width:22px;height:22px}
nav.tabbar a b{font-size:15px!important;line-height:1.1}
nav.tabbar a small{font-size:10.5px!important;text-transform:none!important;letter-spacing:0!important}
nav.tabbar a[aria-current="page"]{background:rgba(242,165,49,.18)!important;color:var(--accent)}
nav.tabbar a[aria-current="page"] b{color:var(--accent)!important}
@media (min-width:900px){nav.tabbar{left:50%;right:auto;transform:translateX(-50%);bottom:12px;border:1px solid #33353b;border-top:3px solid var(--accent);border-radius:14px;width:560px;padding:6px}body.has-tabs{--navh:84px}}

.bell{position:relative;background:none;border:0;color:var(--head-fg);width:44px;height:44px;display:grid;place-items:center;border-radius:10px;cursor:pointer}
.bell:hover{background:rgba(255,255,255,.08)}
.bell svg{width:26px;height:26px}
.nbadge{position:absolute;top:2px;right:0;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-style:normal;font-size:12px;font-weight:700;line-height:20px;text-align:center;font-family:var(--body)}
nav.tabbar a{position:relative}
nav.tabbar a .nbadge{top:2px;right:calc(50% - 26px)}
.filt button .nbadge{position:static;display:inline-block;margin-left:2px}
.sale.unread{background:#fffaf0;box-shadow:0 0 0 1px rgba(196,63,56,.25)}
.newchip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--bad);color:#fff;border-radius:5px;padding:2px 6px;margin-right:6px;vertical-align:3px}
.listbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.listbar label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.listbar select{width:auto;min-width:190px}
.nlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.nitem{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%;color:var(--fg);font:inherit}
.nitem:first-child{border-top:0}
.nitem:hover{background:var(--panel-2)}
.nitem.unread{background:#fffaf0}
.nitem .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:18px;font-weight:700}
.nitem .ic.q{background:rgba(42,104,173,.12);color:var(--info)}
.nitem .ic.s{background:rgba(30,138,79,.12);color:var(--good)}
.nitem .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nitem .tx b{font-size:16px}
.nitem .tx span{font-size:14px;color:var(--muted)}
.nitem .dotu{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none;margin-top:6px}
.chg{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.chgbox{border:1px solid #e6c27a;background:#fff6e3;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.chgbox b{font-size:16px}
.chgbox ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.plan{display:flex;flex-direction:column;gap:6px}
.plan .pr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end}
@media (max-width:560px){.plan .pr{grid-template-columns:1fr 1fr}.plan .pr .del{justify-self:end}}
.plangen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.sumchk{font-size:14.5px;padding:8px 10px;border-radius:8px;background:var(--panel-2)}
.sumchk.bad{background:rgba(196,63,56,.08);color:var(--bad)}
.termsel{display:flex;flex-direction:column;gap:6px}
.termsel label{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.termsel input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}
.termsel label.off span{text-decoration:line-through;color:var(--muted)}
.pricemode{display:flex;gap:6px;flex-wrap:wrap}
.pricemode button{padding:9px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);font-weight:600;cursor:pointer}
.pricemode button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
@media (max-width:560px){.totalbar .pkg{display:none}.acts{margin-left:0;width:100%}.acts .btn{flex:1;padding:10px 8px;font-size:15px}}
.pay{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.payhd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.payhd b:first-child{font-size:16px}
.plist{display:flex;flex-direction:column;gap:6px}
.pit{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.pit>div:first-child{display:flex;flex-direction:column}
.pit span{font-size:14px;color:var(--muted)}
.pit.done{opacity:.75}
.pit.late{border-color:var(--bad)}
.pst{font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px}
.pst.ok{color:var(--good);background:rgba(30,138,79,.1)}
.pst.late{color:#fff;background:var(--bad)}
.rest{font-size:13.5px;font-weight:700;color:var(--bad)}
.nitem .ic.p{background:rgba(196,63,56,.1);color:var(--bad)}
.staffbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#1f6f4a;color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.staffbar .btn{background:#fff;color:#1f6f4a;border-color:#fff}
.tagstaff{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;border:1px solid var(--info);color:var(--info);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.uchip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;background:rgba(255,255,255,.08);border:0;border-radius:9px;padding:6px 10px;color:var(--head-fg);cursor:pointer;font:inherit}
.uchip b{font-size:14.5px}.uchip span{font-size:11.5px;color:var(--head-muted)}
body.ulogin nav.tabbar,body.ulogin #bell,body.ulogin #uchip{display:none}
.ulist{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ulist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.ulist button b{font-family:var(--display);font-size:21px}
.ulist button span{font-size:13.5px;color:var(--muted)}
.ulist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sug{display:flex;flex-direction:column;gap:6px}
.sug button{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-radius:9px;border:1px solid var(--info);background:rgba(42,104,173,.06);cursor:pointer;text-align:left;font:inherit;color:var(--fg)}
.sug button span{font-size:13.5px;color:var(--muted)}
.loglist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.loglist div{display:flex;gap:8px;align-items:baseline}
.loglist time{color:var(--muted);font-size:12.5px;min-width:92px;font-variant-numeric:tabular-nums}
.who2{font-size:13.5px;color:var(--muted)}
.dek{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;vertical-align:middle}
.dek.big{width:100%;height:auto;max-width:420px;cursor:zoom-out}
.payrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.payrow:first-child{border-top:0}
.syncst{font-size:13px;color:var(--head-muted);cursor:default}
.syncst.err{color:#ff9b8f;cursor:pointer;text-decoration:underline}
.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.done .big{font-family:var(--display);font-size:30px;font-weight:700;color:var(--good)}
img[src^="drv:"]{visibility:hidden;min-height:60px}
/* simple panel */
.subtabs{display:grid!important;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:4px;margin:0 0 22px;padding:6px;background:var(--panel);border:1px solid var(--line)!important;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:visible!important}
.subtabs button{display:flex!important;flex-direction:column;align-items:center;gap:6px;padding:8px 2px!important;border:0!important;border-radius:12px;background:none;font-family:var(--body)!important;font-size:13.5px!important;font-weight:600;letter-spacing:.01em;color:var(--muted);text-align:center;position:relative;min-width:0;white-space:nowrap;transition:color .15s}
.subtabs .ti{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);transition:background .15s,color .15s,box-shadow .15s}
.subtabs .ti svg{width:22px;height:22px}
.subtabs button:hover{color:var(--fg)}
.subtabs button:hover .ti{border-color:var(--line-strong);color:var(--fg)}
.subtabs button[aria-selected="true"]{color:var(--fg);background:none;box-shadow:none}
.subtabs button[aria-selected="true"] .ti{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink);box-shadow:0 3px 10px rgba(242,165,49,.38)}
.subtabs button[aria-selected="true"]::after{content:"";position:absolute;bottom:-7px;left:30%;right:30%;height:3px;border-radius:3px 3px 0 0;background:var(--accent-text)}
.subtabs .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.subtabs .tl .lg{display:none}
@media (min-width:760px){.subtabs{padding:6px 8px}.subtabs button{flex-direction:row!important;justify-content:center;gap:10px;font-size:16px!important;padding:8px 6px!important}.subtabs .ti{width:38px;height:38px;border-radius:11px}.subtabs .tl .lg{display:inline}.subtabs .tl .sm{display:none}}
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:15px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;color:var(--fg)}
.bigbtn b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.bigbtn span{font-size:14.5px;opacity:.85}
.bigbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bigbtn.wa2{background:#1f9d57;border-color:#1f9d57;color:#fff}
.bigbtn:hover{filter:brightness(1.05)}
.filt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filt>span{font-weight:600;color:var(--muted);margin-right:2px}
.filt button{padding:8px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;font-weight:600;display:inline-flex;gap:7px;align-items:center;font-size:15px}
.filt button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.filt .c{font-variant-numeric:tabular-nums;opacity:.7}
.sale .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sale .who b{font-size:18px}
.next{display:flex;flex-direction:column;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.next>span{font-weight:600}
.next .row input[type=date]{width:auto}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--info);font-weight:600;cursor:pointer;text-align:left;font-size:15.5px;align-self:flex-start}
.linkbtn.danger{color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;font-size:15.5px}
.facts div span{display:block;font-size:13px;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--bad);background:rgba(196,63,56,.07);border-radius:10px;padding:10px 12px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.tierline{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.tierline b{color:var(--fg);font-weight:700}
.ecard{display:flex;flex-direction:column;gap:12px}
details.pe summary{padding:14px 16px!important}
.pname{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pname b{font-size:17px}
.pname small{font-size:14px;color:var(--muted);font-weight:400}
.pname .brands{font-size:14px;color:var(--fg)}
.ocard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel-2)}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ohead b{font-size:16px}
.f4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.subhead{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* contract */
.paper{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,4vw,36px);display:flex;flex-direction:column;gap:16px}
.paper h2{color:var(--ink)}
.paper .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px;font-size:14px}
.paper .meta div span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#6a6c72}
.paper table th{background:#ebe8df;color:#55575d}
.paper table td,.paper table th{border-color:#d9d5ca}
.paper .tbl{border-color:#d9d5ca}
.paper tfoot td{background:#ebe8df}
.paper ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sigbox{border:2px dashed #b9b4a6;border-radius:10px;background:#fff;position:relative;touch-action:none}
.sigbox canvas{display:block;width:100%;height:170px;cursor:crosshair}
.sigbox .ph{position:absolute;inset:auto 12px 10px;font-size:12.5px;color:#8b8678;pointer-events:none;border-top:1px solid #d8d3c6;padding-top:4px}
.paper .btn{background:#ebe8df;border-color:#cfcabd;color:var(--ink)}
.paper .btn.pri{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink)}
.paper input[type=text]{background:#fff;border-color:#cfcabd;color:var(--ink)}
.paper .toggle input{accent-color:#c47d0e}
.signed{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px solid #9fd1b2;background:#e8f5ed;border-radius:10px;padding:12px}
.signed img{height:70px;background:#fff;border-radius:6px;border:1px solid #d9d5ca}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- iş paylaşımı ---- */
body.worker nav.tabbar{grid-template-columns:repeat(2,1fr)}body.worker nav.tabbar a[data-v=teklif],body.worker nav.tabbar a[data-v=sozlesme]{display:none}
@media (max-width:480px){nav.tabbar small{display:none}}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;display:flex;gap:10px;align-items:flex-start}
.pcard.on{border-color:var(--accent-text);box-shadow:0 0 0 2px var(--accent-soft)}
.pcard .pmain{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;gap:6px}
.pcard .pmain b{font-family:var(--display);font-size:20px}
.pcard .pmain .st{font-size:14.5px}
.pcard .late{color:var(--bad);font-weight:700}
.pbar{height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.pingbtn{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--accent-text);background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;cursor:pointer}
.pingbtn svg{width:24px;height:24px}
.pingbtn[disabled]{opacity:.5;cursor:default}
.preply{font-size:13.5px;background:var(--panel-2);border-radius:8px;padding:6px 8px}
.jlist{display:flex;flex-direction:column;gap:8px}
.jrow{border:1px solid var(--line);border-left:4px solid var(--js,var(--line));border-radius:10px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.jrow.late{border-color:var(--bad);background:rgba(200,40,40,.04)}
.jrow .jt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.jst{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.j-yeni{--js:var(--muted)} .j-basladi{--js:var(--info)} .j-parca{--js:var(--accent-text)} .j-hazir,.j-teslim{--js:var(--good)}
.jst.j-basladi{background:rgba(42,104,173,.12);color:var(--info)}
.jst.j-parca{background:var(--accent-soft);color:var(--accent-text)}
.jst.j-hazir,.jst.j-teslim{background:rgba(30,138,79,.12);color:var(--good)}
.jst.lt{background:var(--bad);color:#fff}
.jphoto{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.jphoto.big{width:100%;height:auto;max-width:520px;cursor:zoom-out}
.jsum{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px}
.jsum span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel)}
.jsum span.ok{border-color:var(--good);color:var(--good)}
.jsum span.lt{border-color:var(--bad);color:var(--bad)}
.wjob{border:1px solid var(--line);border-left:6px solid var(--js,var(--line));border-radius:14px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.wjob.late{border-color:var(--bad)}
.wjob h3{margin:0;font-size:22px}
.wjob .when{font-weight:700}
.wjob .when.lt{color:var(--bad)}
.stbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stbtns .btn{min-height:56px;font-size:18px;justify-content:center}
.pingcard{border:2px solid var(--accent-text);background:var(--accent-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pingcard .stbtns .btn{min-height:50px;font-size:16px}
.nitem .ic.j{background:rgba(30,138,79,.12);color:var(--good)}
.nitem .ic.k{background:var(--accent-soft);color:var(--accent-text)}
.mini{font-size:13px}
.rulebox{display:flex;flex-wrap:wrap;gap:6px 16px}

/* ---- mesajlar ---- */
.clist{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit}
.citem.unread{border-color:var(--accent-text);background:linear-gradient(90deg,var(--accent-soft),var(--panel) 60%)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;background:var(--head);color:var(--accent);flex:none}
.av.g{background:var(--accent);color:var(--accent-ink)}
.citem .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.citem .tx b{font-size:17px}
.citem .tx span{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted)}
.citem .rt .nbadge{position:static}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.chead .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.chead .tx b{font-family:var(--display);font-size:22px}
.btn.call{background:#1e8a4f;border-color:#176c3d;color:#fff}
.btn.call svg,.btn.msgb svg{width:18px;height:18px}
.thread{display:flex;flex-direction:column;gap:8px;padding:4px 0 10px}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.bub{max-width:82%;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.msg.me .bub{background:#fdf0d9;border-color:#ecc985;border-radius:14px 14px 4px 14px}
.mfrom{font-size:13px;color:var(--accent-text)}
.mtx{white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.mt{font-size:11.5px;color:var(--muted);align-self:flex-end}
.mt .rd{color:#2a68ad;font-weight:700}
.mimg{max-width:240px;width:100%;border-radius:10px;cursor:zoom-in}
.mjob{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--js,var(--accent));border-radius:8px;padding:6px 9px;font:inherit;color:inherit;cursor:pointer;font-size:13.5px}
.mjob b{font-size:14px}
.dsep{align-self:center;font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:99px;padding:2px 10px}
.composer{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer textarea{min-height:56px}
.ctag{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:13.5px}
.ctag .x{margin-left:auto}
.cpick{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.seen{font-size:13px}
.seen.no{color:var(--bad);font-weight:700}
.seen.ok{color:#2a68ad}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.kvbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.kvbox.need{border-color:var(--bad)}
.kvtext{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:var(--panel-2);border-radius:8px;padding:10px 12px;max-height:260px;overflow:auto}
.paper .kvbox{background:#fff;color:#17181c;border-color:#d8d4ca}
.paper .kvtext{background:#f6f3ec;color:#2a2c31}
.kvok{color:var(--good);font-weight:600}

/* ---- sohbet çubuğu (klavye üstünde) ---- */
body.inchat nav.tabbar{display:none!important}
body.inchat main{padding-bottom:calc(var(--chath,140px) + 16px)!important}
.chatbar{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:40;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.08);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.chatbar .in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.crow{display:flex;gap:6px;align-items:flex-end}
.crow textarea{flex:1;min-height:46px;max-height:130px;resize:none;border-radius:22px;padding:11px 14px;line-height:1.35}
.cbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);background:var(--panel-2);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--fg);font-size:20px;padding:0}
.cbtn svg{width:22px;height:22px}
.cbtn.send{background:var(--accent);border-color:var(--accent-text);color:var(--accent-ink)}
.cbtn.on{background:var(--fg);color:var(--panel)}
.amenu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.amenu button,.amenu label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--fg)}
.amenu .i{font-size:22px}
.recbar{display:flex;align-items:center;gap:10px;border:1px solid var(--bad);border-radius:23px;padding:6px 6px 6px 14px;background:rgba(196,63,56,.06)}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.recbar .t{font-weight:700;font-variant-numeric:tabular-nums;flex:1}
.chatbar .ctag{max-height:180px;overflow:auto}
.chatbar .cpick{max-height:240px}
.mcard{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.mcard .row{gap:6px}
.mcard .btn{padding:6px 10px;font-size:13.5px}
.mdoc{display:flex;gap:10px;align-items:center}
.mdoc .ic{width:40px;height:40px;border-radius:8px;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.mdoc .ic.x{background:#1e7a45}.mdoc .ic.w{background:#2a5aa8}.mdoc .ic.o{background:var(--muted)}
.mdoc .tx{min-width:0;display:flex;flex-direction:column}
.mdoc .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.bub audio{width:230px;max-width:100%;height:40px}
.mdel{font-style:italic;color:var(--muted)}
.mact{background:none;border:0;padding:0;color:var(--info);font-size:11.5px;font-weight:600;cursor:pointer;margin-left:6px}
.pinbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:flex-start;background:#fff6e3;border:1px solid #e6c27a;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14.5px}
.pinbar .tx{flex:1;min-width:0}
.plrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) minmax(0,1.4fr) auto;gap:6px;align-items:end}
@media (max-width:620px){.plrow{grid-template-columns:1fr}}

/* ---- motor paketleri ---- */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media (max-width:480px){.ecard2 .t{font-size:17px}.ecard2 .p{font-size:19px}.ecard2 .bd{padding:8px 10px}}
.ecard2{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;cursor:pointer;color:inherit;font:inherit}
.ecard2[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:0 0 0 2px var(--accent-soft)}
.ecard2 .ph{aspect-ratio:16/10;background:linear-gradient(135deg,#2a2c31,#17181c);display:grid;place-items:center;color:#f2a531;overflow:hidden}
.ecard2 .ph img{width:100%;height:100%;object-fit:cover}
.ecard2 .ph svg{width:46%;height:auto;opacity:.85}
.ecard2 .bd{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ecard2 .code{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ecard2 .t{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15}
.ecard2 .p{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent-text)}
.edet{border:1px solid var(--accent-text);border-radius:14px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:12px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gal img{height:190px;max-width:none;border-radius:10px;scroll-snap-align:start;cursor:zoom-in;border:1px solid var(--line)}
.gal img.big{height:auto;width:100%;max-width:100%;cursor:zoom-out}
.plist2{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plist2 span{padding:8px 12px;border-top:1px solid var(--line);font-size:15px}
.plist2 span:nth-child(-n+2){border-top:0}
.plist2 span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.cores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cores button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:inherit;font:inherit}
.cores button b{font-size:16.5px}
.cores button span{font-size:13.5px;color:var(--muted)}
.cores button[aria-pressed="true"]{border-color:var(--accent-text);background:linear-gradient(180deg,var(--accent-soft),var(--panel) 75%)}
.depbox{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.depbox.wait{border-color:var(--accent-text)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:6px;align-items:end}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:96px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-size:13px}
.emeta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:14.5px;color:var(--muted)}
.emeta b{color:var(--fg)}
/* ---- stok ---- */
.srows{display:flex;flex-direction:column;gap:8px}
.srow{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:12px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.srow.low{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(196,63,56,.06),var(--panel) 50%)}
.srow .top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.srow .nm{display:flex;flex-direction:column;min-width:0}
.srow .nm b{font-size:16.5px}
.srow .qty{display:flex;align-items:baseline;gap:6px}
.srow .qty .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.srow.low .qty .n{color:var(--bad)}
.srow .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.srow .ctl input{width:90px}
.mini-in{width:84px!important;padding:7px 8px!important}
.potab{display:grid;grid-template-columns:minmax(0,1fr) auto 92px auto;gap:6px 10px;align-items:center}
.potab .h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.potab .lowt{color:var(--bad);font-weight:700}
.pocard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.tagesnaf{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;border:1px solid var(--accent-text);color:var(--accent-text);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
@media (max-width:759px){.subtabs.many{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:minmax(60px,1fr);overflow-x:auto!important;scroll-snap-type:x proximity}.subtabs.many button{font-size:12.5px!important;scroll-snap-align:start}.subtabs.many .ti{width:40px;height:40px}}

/* ---- asistan ---- */
.aifab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--navh,0px) + 16px);z-index:35;display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;height:56px;border-radius:28px;border:0;background:var(--head);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.aifab .dot{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.aifab .dot svg{width:18px;height:18px}
.aifab .nbadge{position:absolute;top:-4px;right:-2px}
body.inchat .aifab,body.ulogin .aifab{display:none}
.aifab{touch-action:none;user-select:none;-webkit-user-select:none}.aifab.drag{opacity:.85;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:none}.aifab.placed{right:auto;bottom:auto}
.aiwrap{display:flex;flex-direction:column;gap:12px}
.aihead{display:flex;align-items:center;gap:12px}
.aiav{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd28a,#f2a531 55%,#a86400);display:grid;place-items:center;color:#1b1305;flex:none;box-shadow:0 0 0 0 rgba(242,165,49,.6)}
.aiav svg{width:26px;height:26px}
.aiav.listening{animation:aipulse 1.2s infinite}
.aiav.speaking{animation:aipulse .8s infinite}
.aiav.thinking{animation:aispin 1.4s linear infinite;background:conic-gradient(#f2a531,#ffd28a,#a86400,#f2a531)}
@keyframes aipulse{0%{box-shadow:0 0 0 0 rgba(242,165,49,.55)}100%{box-shadow:0 0 0 18px rgba(242,165,49,0)}}
@keyframes aispin{to{transform:rotate(360deg)}}
.aithread{display:flex;flex-direction:column;gap:8px;min-height:120px}
.aimsg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:16px;line-height:1.4;white-space:pre-wrap}
.aimsg.u{align-self:flex-end;background:#fdf0d9;border:1px solid #ecc985;border-radius:16px 16px 4px 16px}
.aimsg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
.aimsg.partial{opacity:.65;font-style:italic}
.aicard{align-self:stretch;border:2px solid var(--accent-text);border-radius:14px;background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.aicard.done{border-color:var(--good);border-width:1px}
.aicard.cancel{border-color:var(--line);border-width:1px;opacity:.75}
.aicard .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.aibar{position:sticky;bottom:calc(var(--navh,0px) + 8px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.aimic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(242,165,49,.45)}
.aimic svg{width:38px;height:38px}
.aimic.on{background:var(--bad);color:#fff;animation:aipulse 1.2s infinite}
.aimic[disabled]{opacity:.5}
.aistat{font-size:14px;color:var(--muted);text-align:center;min-height:20px}
.aitype{display:flex;gap:6px;width:100%}
.aitype input{flex:1}
.ailog{display:flex;flex-direction:column;gap:6px}
.ailog div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);font-size:14.5px}
.ailog time{display:block;font-size:12px;color:var(--muted)}
</style>

function dpatch(b,c,coll){const p={set:{},del:[],c:{},log:[]};let any=false;b=b||{};coll=coll||[];

const AI_YESW=new Set('evet tamam tamamdır tamamdir yap yapın yapalım olur onayla onaylıyorum onaylıyoruz onayladım gönder aynen doğru peki kabul hıhı he'.split(' ')),AI_NOW=new Set('hayır hayir dur yapma vazgeç vazgeçtim iptal bekle gönderme olmaz'.split(' '));
function aiIsNo(t){return aiNorm(t).split(' ').some(x=>AI_NOW.has(x))}
function aiIsYes(t){const w=aiNorm(t).split(' ');return w.some(x=>AI_YESW.has(x))&&!w.some(x=>AI_NOW.has(x))}
let aiTurnNo=0,aiNoTools=null;
function aiRun(p){if(p.status!=='bekliyor')return 'Bu işlem zaten '+(p.status==='yapildi'?'yapılmış':'iptal edilmiş');const a=p.args,t=new Date().toISOString(),tag=' · Asistan';let res='yapıldı',extra=null;
  if(p.kind==='is_ata'){const s=S.sales.find(x=>x.id===a.sid);mkJob(s,a.kind,a.uid,{note:a.note,...(a.due?{due:a.due}:{})});logAct(s,'İş verdi ('+uname(a.uid)+': '+(a.kind==='diger'?a.note:JK[a.kind].toLowerCase())+')'+tag)}
  else if(p.kind==='is_aktar'){const s=S.sales.find(x=>x.id===a.sid),j=s&&(s.jobs||[]).find(x=>x.id===a.jid);if(!j)throw new Error('İş artık yok');const old=j.to;j.to=a.uid;j.wSeen=false;delete j.seenAt;j.hist.push({t,u:CUR.name,st:j.status,note:'İş '+uname(old)+' yerine '+uname(a.uid)+' kişisine verildi (asistan)'});logAct(s,'İşi '+uname(a.uid)+' kişisine verdi ('+jobLabel(j)+')'+tag)}
  else if(p.kind==='mesaj'){(S.msgs=S.msgs||[]).push({id:rid(),from:CUR.id,to:a.to,t,text:a.text,readBy:{[CUR.id]:t}})}
  else if(p.kind==='konum'){const pl=places().find(x=>x.id===a.pid)||{};(S.msgs=S.msgs||[]).push({id:rid(),from:CUR.id,to:a.to,t,text:'',loc:{name:pl.name,addr:pl.addr,url:pl.url||''},readBy:{[CUR.id]:t}})}
  else if(p.kind==='ping'){(S.pings=S.pings||[]).push({id:rid(),to:a.uid,by:CUR.name,t,answered:false})}
  else if(p.kind==='po'){const po={id:rid(),no:nextPoNo(),sup:a.sup,date:today(),t,by:CUR.name+' (asistan)',lines:a.lines,total:a.total,status:'gonderildi'};(S.pos=S.pos||[]).push(po);p.po=po.id;res=po.no+' oluşturuldu; WhatsApp mesajı hazır, patron tek dokunuşla gönderecek'}
  else if(p.kind==='esnaf'){const e=(S.esnaf||[]).find(x=>x.id===a.eid);const q=newQ(a.engineId);q.qty=a.qty;q.core=a.core;q.name=e.shop;q.phone=e.phone;
    const s={id:'s'+Date.now(),no:nextNo(),token:rid(),kind:'esnaf',esnafId:e.id,customer:{name:e.shop,phone:e.phone,plate:''},status:'satildi',dates:{geldi:today(),satildi:today()},seen:true,approved:{u:CUR.name,t},...snapshot(q),delivery:{mode:e.addr?'adres':'dukkan',where:e.addr||''}};
    if(e.kvkk)s.kvkk={at:e.kvkk.at,how:'yuz',by:e.kvkk.by};s.by=CUR.name;S.sales.push(s);logAct(s,'Esnaf siparişi oluşturdu ('+a.qty+' adet)'+tag);if((S.settings.jobTrigger||'imza')!=='manuel')startJobs(s,true);reserveSale(s);res=s.no+' kaydedildi'}
  else if(p.kind==='prep'){createTask({kind:'hazirlama',to:[a.to||S.settings.vekil].filter(Boolean),title:a.n+' adet '+engName(a.eid)+' hazırla',eid:a.eid,qty:a.n,due:a.due})}
  else if(p.kind==='task'){createTask({kind:a.kind,to:a.to,title:a.title,place:a.place||null,note:a.note||'',due:a.due})}
  else if(p.kind==='stok'){const pt=part(a.pid);pt.stock=(+pt.stock||0)+a.n;(S.stockLog=S.stockLog||[]).push({id:rid(),t,pid:pt.id,d:a.n,ref:'Asistan',by:CUR.name})}
  p.status='yapildi';p.doneAt=t;p.result=res;(S.aiLog=S.aiLog||[]).push({t,title:p.title,result:res,kind:p.kind});save();aiPaint();return res}
function aiCtx(){return `Sen Eren Oto'nun (Renault ticari motor revizyonu yapan atölye) asistanısın. Patron ${CUR.name} ile SESLİ konuşuyorsun; yazdığın her şey sesli okunacak.
KURALLAR:
- İşini bilen, patronla telefonda konuşan bir çalışan gibi konuş: doğal, samimi, net. Sorulanın cevabını TAM ver, gerekirse isimleri ve rakamları say; ama gereksiz giriş, tekrar ve kalıp cümle yok. Basit soruya bir cümle yeter, "kimde ne iş var" gibi soruya herkesi tek tek söyle.
- Önceki cevaplarını tekrar etme; aynı cümle kalıbını üst üste kullanma. Patron ne istediyse ona odaklan.
- Sesli okunacağı için liste, madde işareti, başlık, emoji, markdown kullanma; düz konuşma cümleleri kur. Rakamları "85.000 lira" gibi yaz.
- Öneri istenirse veriye bakıp gerçekten düşün: önceliği, nedenini ve ne yapılacağını söyle.
- "Merhaba" denirse kısaca selam ver ve "Buyurun" de.
- Bilgileri SADECE araçlardan al, her soruda yeniden çek. Asla rakam veya isim uydurma. Araç sonucu yoksa "Sistemde bu bilgi yok" de.
- Araç çağırmadan önce hiçbir şey yazma; sonuçları aldıktan sonra cevabı yaz.
- Öneri yapabilirsin: stok kaç gün yeter, iş yükü dengesi, öncelik, vadesi gelen ödemeler. Kısa gerekçe ver.
- İŞLEM KURALI: Bir işlem için önce islem_hazirla aracını çağır; araç onay_id döner, işlem henüz yapılmamıştır. Sonra TEK kısa cümleyle onay sor, örn. "Mehmet'e veriyorum, onaylıyor musunuz?" Detayları tekrar okuma.
- Patron evet/tamam/yap derse onay_cevabi aracını onay_id ve karar=evet ile çağır ve sadece "Tamam, yapıldı." de (tedarikçi siparişinde "Tamam, sipariş hazır, WhatsApp'tan gönderebilirsiniz." de). Hayır/dur/vazgeç derse onay_cevabi aracını karar=hayir ile çağır ve "Tamam, iptal." de.
- Komut belirsizse sadece eksik bilgiyi kısaca sor (örn. "Ahmet'in hangi işini?"). Gerekirse önce veri_oku konu=isler ile listele.
- Tedarikçi siparişinde: eksik parçaları söyle, her biri için "kaç tane?" diye sor, cevapları not al, hepsi bitince islem_hazirla tur=tedarikci_siparisi ile tüm kalemleri bir kez gönder.
- Silme, fiyat değiştirme, satış iptali yapamazsın; "Bunu güvenlik için panelden yapın" de.
BAĞLAM: Bugün ${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}, saat ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}.
Kişiler: ${S.users.map(u=>u.name+' ('+ROLES[u.role].split(' (')[0]+(u.task?', '+(TASKS[u.task]||''):'')+')').join(', ')}.
Tedarikçiler: ${(S.suppliers||[]).map(t=>t.name).join(', ')||'yok'}. Esnaflar: ${(S.esnaf||[]).map(e=>e.shop).join(', ')||'yok'}. Motorlar: ${S.engines.map(e=>e.name).join(', ')}. Kayıtlı konumlar: ${places().map(p=>p.name).join(', ')||'yok'}.
Onay bekleyen işlemler: ${aiPend().map(p=>p.id+': '+p.title).join(' | ')||'yok'}.`}
async function aiAsk(text){if(LIVE.ok&&MODE==='app'){liveText(String(text||'').trim());return}text=String(text||'').trim();if(!text||aiBusy)return;await aiSetup();
  if(!AI.sample){aiStatus='Yapay zeka bu görünümde kullanılamıyor (claude.ai içinde açın).';aiPaint();return}
  aiLastUser=text;aiTurnNo++;(S.aiChat=S.aiChat||[]).push({r:'u',x:text,t:new Date().toISOString()});aiTurns.push({role:'user',content:text});
  {const P0=(S.aiPending||[]).filter(p=>p.status==='bekliyor'&&p.turn<aiTurnNo),mt=Math.max(-1,...P0.map(p=>p.turn)),LP=P0.filter(p=>p.turn===mt),wc=aiNorm(text).split(' ').length;
   if(LP.length&&wc<=6&&(aiIsYes(text)||aiIsNo(text))){let msg;try{if(aiIsYes(text)){LP.forEach(p=>aiRun(p));msg=LP.some(p=>p.kind==='po')?'Tamam, sipariş hazır. WhatsApp\'tan göndermeyi unutmayın.':'Tamam, yapıldı.'}else{LP.forEach(p=>{p.status='iptal';p.doneAt=new Date().toISOString()});msg='Tamam, iptal.'}}catch(e){msg='Yapamadım: '+e.message}
     aiTurns.push({role:'assistant',content:msg});S.aiChat.push({r:'a',x:msg,t:new Date().toISOString()});save();aiPaint();if(aiVoice&&AI.tts)AI.tts.speak(msg,{language:'tr'}).catch(()=>{});return}}
  aiBusy=true;aiState='thinking';aiStatus='Düşünüyor…';const live={r:'a',x:'',t:new Date().toISOString(),live:true};S.aiChat.push(live);aiPaint();
  aiCtl=new AbortController();
  const onT=({text})=>{live.x=text.replace(/\n\s*\n/g,' ').trim();const el=document.getElementById('ailive');if(el)el.textContent=live.x;else aiPaint()};
  const turns=[{role:'user',content:aiCtx()},{role:'assistant',content:'Anlaşıldı.'},...aiTurns.slice(-14)];
  const plain=()=>AI.sample([{role:'user',content:aiCtx()+'\n\nŞU ANDA ARAÇ KULLANAMIYORSUN. Sadece bilgi ver; işlem istenirse "Bu görünümde işlem yapamıyorum, panelden yapın" de. GÜNCEL VERİ (JSON): '+aiSnapshot()},{role:'assistant',content:'Anlaşıldı.'},...aiTurns.slice(-14)],{modelTier:'default',signal:aiCtl.signal,cache:false,onText:onT});
  if(aiNoTools===null){try{const L=await AI.sample.limits();aiNoTools=!(L&&L.tools&&L.tools.maxCount>=3)}catch(e){aiNoTools=false}}
  try{let r;if(aiNoTools)r=await plain();else{try{r=await AI.sample(turns,{tools:aiTools(),modelTier:'default',signal:aiCtl.signal,onText:onT})}catch(e){if(e&&(e.code==='tools_unavailable'||e.code==='invalid_request')){console.warn('asistan araç hatası',e);aiNoTools=true;r=await plain()}else throw e}}
    const ans=r.text.replace(/[#*_`]/g,'').replace(/\n\s*\n/g,' ').trim();live.x=ans;delete live.live;aiTurns.push({role:'assistant',content:ans});
    aiBusy=false;aiState='idle';aiStatus='';if(S.aiChat.length>60)S.aiChat=S.aiChat.slice(-60);save();aiPaint();
    if(aiVoice&&AI.tts&&ans){AI.tts.speak(ans.slice(0,1900),{language:'tr',rate:1.05}).catch(()=>{})}}
  catch(e){console.error('asistan',e);delete live.live;live.x=e.code==='cancelled'?(e.text||'(durduruldu)'):e.code==='not_granted'?'Yapay zeka izni verilmedi.':e.code==='rate_limited'?'Çok sık soruldu, biraz bekleyip tekrar deneyin.':e.code==='session_expired'?'Claude oturumunuz kapanmış; sayfayı yenileyip tekrar giriş yapın.':e.code==='sampling_disabled'?'Bu hesapta yapay zeka kullanımı kapalı.':'Bir sorun oldu, tekrar dener misiniz? (hata: '+((e&&(e.code||e.message))||String(e)).toString().slice(0,80)+')';aiTurns.pop();aiBusy=false;aiState='idle';aiStatus='';save();aiPaint()}}
function aiCard(p){const po=p.po&&(S.pos||[]).find(x=>x.id===p.po),sup=po&&(S.suppliers||[]).find(t=>t.id===po.sup);
  return `<div class="aicard ${p.status==='yapildi'?'done':p.status==='iptal'?'cancel':''}"><span class="k">${p.status==='bekliyor'?'Onay bekliyor':p.status==='yapildi'?'Yapıldı ✓':'İptal edildi'} · ${new Date(p.t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span><b>${esc(p.title)}</b>
  ${p.status==='bekliyor'?`<div class="row"><button class="btn pri" data-act="aiok" data-id="${p.id}">Onayla</button><button class="btn" data-act="ainok" data-id="${p.id}">Vazgeç</button></div>`:''}
  ${po&&p.status==='yapildi'?`<span class="pst ${po.sentAt?'ok':'late'}">${po.sentAt?'✓ WhatsApp mesajı gönderildi':'WhatsApp\'tan henüz gönderilmedi'}</span>`:''}${po&&sup&&sup.phone&&p.status==='yapildi'&&!po.sentAt?`<div class="row"><a class="btn sm wa" href="${waLink(sup.phone,poMsg(po))}" target="_blank" rel="noopener" data-posent="${po.id}">${WA_ICON}WhatsApp'tan gönder</a><button class="btn sm" data-act="popdf" data-id="${po.id}">PDF</button></div>`:''}</div>`}
function pAsistan(){setTimeout(aiSetup,0);const pend=aiPend();
  let h=`<div class="section aiwrap"><div class="aihead"><span class="aiav ${aiState}">${AI_SVG}</span><div style="flex:1;min-width:0"><h2 style="margin:0">Asistan</h2><span class="small muted">Konuşun; bilgi verir, öneri yapar, onayınızla iş yapar.</span></div><label class="toggle small"><input type="checkbox" id="ai-voice" ${aiVoice?'checked':''}><span>Sesli cevap</span></label></div>
  <div class="filt"><button data-act="aiseg" data-k="konus" aria-pressed="${aiSeg==='konus'}">Konuşma</button><button data-act="aiseg" data-k="onay" aria-pressed="${aiSeg==='onay'}">Onay bekleyenler${pend.length?` <span class="c">${pend.length}</span>`:''}</button><button data-act="aiseg" data-k="gecmis" aria-pressed="${aiSeg==='gecmis'}">İşlem geçmişi</button></div></div>`;

function initSig(){
  const cv=document.getElementById('sig');if(!cv)return;const dpr=window.devicePixelRatio||1;
  const fit=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext('2d');x.lineCap='round';x.lineJoin='round';x.lineWidth=2.4*dpr;x.strokeStyle='#16181c'};

  const pt=ev=>{const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)*dpr,(ev.clientY-r.top)*dpr]};
  cv.addEventListener('pointerdown',ev=>{down=true;last=pt(ev);sig.strokes.push([nrm(ev)]);cv.setPointerCapture(ev.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1.2*dpr,0,7);ctx.fillStyle='#16181c';ctx.fill()});
  cv.addEventListener('pointermove',ev=>{if(!down)return;const p=pt(ev);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;sig.strokes.at(-1).push(nrm(ev));if(!sig.ink){sig.ink=true;upd()}});
  const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}

function parseImport(txt){
  const ms=String(txt||'').match(/EOS1\.([A-Za-z0-9_-]{10,})/);
  if(ms){let d;try{d=b64d(ms[1])}catch(e){return{err:'İmza kodu okunamadı. Mesaj eksik kopyalanmış olabilir.'}}
    const sale=S.sales.find(x=>x.no===d.no);if(!sale)return{err:d.no+' numaralı satış bu panelde bulunamadı.'};
    let img=null;try{img=d.g?sigToImg(d.g):null}catch(e){}
    return{kind:'sign',d,sale,img,dup:!!(sale.sign&&sale.sign.at===d.at)};}
  const m=String(txt||'').match(/EO1\.([A-Za-z0-9_-]{20,})/);if(!m)return{err:txt.trim()?'Mesajda uygulama kodu bulunamadı. Mesajın tamamını kopyaladığınızdan emin olun.':''};
  let d;try{d=b64d(m[1])}catch(e){return{err:'Kod okunamadı. Mesaj eksik kopyalanmış olabilir.'}}
  const q=qFromPayload(d);if(!q)return{err:'Bu motor tipi ('+(d.en||d.e)+') fiyat listesinde yok.'};
  const c=compute(q),key=(d.k||'')+'|'+phoneWa(d.ph);
  return{d,q,c,key,dup:S.sales.some(s=>s.importKey===key)};
}

  if(t.id==='set-vekil'){S.settings.vekil=t.value||null;save();toast(t.value?uname(t.value)+' vekil oldu; İşlerim ekranında motor girişi görecek':'Vekil kaldırıldı');return render()}
  if(t.id==='ai-voice'){aiVoice=t.checked;if(!aiVoice&&AI.tts)try{AI.tts.stop()}catch(e){}return}
  if(t.id==='set-trig'){S.settings.jobTrigger=t.value;save();toast('Kaydedildi');return render()}
  if(d.jf){const s=S.sales.find(x=>x.id===d.id),j=s&&(s.jobs||[]).find(x=>x.id===d.jid);if(!j)return;const old=j[d.jf];j[d.jf]=t.value;
    if(d.jf==='to'&&old!==t.value){j.wSeen=false;delete j.seenAt;j.hist.push({t:new Date().toISOString(),u:CUR.name,st:j.status,note:'İş '+uname(old)+' yerine '+uname(t.value)+' kişisine verildi'});logAct(s,'İşi '+uname(t.value)+' kişisine verdi ('+jobLabel(j)+')');toast(uname(t.value)+' adlı kişiye gönderildi')}
    else if(d.jf==='due'&&old!==t.value)logAct(s,jobLabel(j)+' termini: '+fdate(t.value));
    save();return render()}
  if(d.toff!==undefined){const i=+d.toff;Q.termsOff=(Q.termsOff||[]).filter(x=>x!==i);if(!t.checked)Q.termsOff.push(i);return render()}
  if(d.pl!==undefined){const p=Q.plan[+d.i];p[d.pl]=d.pl==='amt'?Math.round(+t.value||0):t.value;return render()}
  if(d.qn!==undefined){Q[d.qn]=Math.max(0,Math.round(+t.value||0));return render()}
  if(d.tpl){cuMsg[d.tpl]=t.value;return render()}
  if(d.engF!==undefined){const e=S.engines[+d.i];if(d.engF==='price')setEngPrice(e,+t.value);else e[d.engF]=t.value;save();return render()}
  if(d.set){const [o,k]=d.set.split('.');S[o][k]=t.type==='number'?(+t.value||0):t.value;save();return render()}
  if(d.pf!==undefined){const p=S.parts[+d.pi];if(d.pf==='req'){p.req=t.value==='1';resyncQ()}else p.name=t.value;openPart=p.id;save();return render()}
  if(d.of!==undefined){const p=S.parts[+d.pi],o=p.opts[+d.oi];o[d.of]=(d.of==='p'||d.of==='c')?(+t.value||0):t.value;openPart=p.id;if(d.of==='t')resyncQ();save();return render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target.id==='upin'||ev.target.id==='su-p2')){ev.preventDefault();document.querySelector('[data-act="ulogin"],[data-act="setup"]')?.click()}});
document.addEventListener('input',ev=>{
  if(ev.target.id==='imp'){handleImp(ev.target.value);return}
  if(ev.target.id==='szpaste'){const c=contractFromHash(ev.target.value);if(c){location.hash=c.key}else{const e=document.getElementById('szerr');if(e)e.textContent=ev.target.value.trim()?'Mesajda sözleşme kodu bulunamadı. Mesajın tamamını kopyalayın.':''}return}
  const t=ev.target;if(t.dataset.q){Q[t.dataset.q]=t.value;sentMsg=null;const s=document.getElementById('sent');if(s)s.remove();if(t.dataset.q==='name'||t.dataset.q==='phone'){const g=document.getElementById('cust-sug');if(g)g.innerHTML=sugHtml()}}
  if(t.dataset.poq!==undefined){const pid=t.dataset.poq,n=Math.max(0,Math.round(+t.value||0));if(n)poDraft[pid]=n;else delete poDraft[pid];const el=document.getElementById('po-total');if(el)el.textContent=fmt(poTotal());const l=document.getElementById('pol-'+pid);if(l)l.textContent=n?fmt(n*((part(pid)||{}).cost||0)):''}
  if(t.id==='sname')upd();
  if(t.id==='m-text'){msgText=t.value;t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,130)+'px';fitPad()}
});
{const _r=render;render=function(){_r();hydrateMedia()}}
(function boot(){
  if(MODE==='musteri'){document.getElementById('bell')?.remove();document.querySelector('nav.tabbar')?.remove();document.body.classList.remove('has-tabs');document.getElementById('hdrt').textContent='Renault ticari motor revizyonu';render();return}
  document.getElementById('hdr').innerHTML='<span id="syncst" class="syncst"></span>';
  document.getElementById('hdr').addEventListener('click',e=>{if(e.target.id==='syncst'&&lastSync==='err')doSync()});
  setInterval(()=>{if(document.hidden||!CUR)return;const fast=view()==='mesaj'||ROLE==='worker';if(Date.now()-lastPull>(fast?7000:20000))pull(false)},3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CUR)pull(false)});
  let a=null;try{a=JSON.parse(localStorage.getItem('eo-auth')||'null')}catch(e){}
  if(a&&a.u&&a.p&&!BOOT.setup&&S.users.some(u=>u.id===a.u)){app.innerHTML='<div class="empty">Giriş yapılıyor…</div>';doLogin(a.u,a.p,true);return}
  render();
})();
})();
